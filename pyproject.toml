[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "NorthStar"
version = "0.1.0"
description = "Local analytics engineering flagship: DuckDB + Parquet lakehouse + dbt + automated quality tests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Alexander James Kershaw" }
]
dependencies = [
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<3.0",
  "pyarrow>=14,<18",
  "duckdb>=1.0,<2.0",
  "dbt-core>=1.7,<2.0",
  "dbt-duckdb>=1.7,<2.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1.0",
  "pytest>=7.0,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"