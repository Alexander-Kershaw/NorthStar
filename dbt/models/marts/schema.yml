version: 2

models:
  - name: fct_asset_uptime_hourly
    description: "Gold fact table at asset-hour grain with numeric uptime indicator."
    columns:
      - name: asset_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_assets')
                field: asset_id

      - name: ts
        tests:
          - not_null

      - name: is_up
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
