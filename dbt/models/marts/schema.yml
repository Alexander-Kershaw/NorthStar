# Gold mart schema

version: 2

models:

# asset uptime fact and testing (hourly)
  - name: fct_asset_uptime_hourly
    description: "Gold fact table at asset-hour grain with numeric uptime indicator."
    columns:
      - name: asset_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_assets')
                field: asset_id

      - name: ts
        tests:
          - not_null

      - name: is_up
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]


# asset dimension and testing
  - name: dim_asset
    description: "Gold dimension for operational assets (authoritative attributes for slicing ops metrics)."
    columns:
      - name: asset_id
        tests:
          - not_null
          - unique

      - name: asset_type
        tests:
          - not_null

      - name: region
        tests:
          - not_null

      - name: capacity_kw
        tests:
          - not_null

  
# daily asset uptime fact and testing 
  - name: fct_asset_uptime_daily
    description: "Daily uptime KPIs at asset-day grain."
    columns:
      - name: asset_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_asset')
                field: asset_id

      - name: date_day
        tests:
          - not_null

      - name: uptime_pct
        tests:
          - not_null

      - name: downtime_hours
        tests:
          - not_null

      - name: total_hours
        tests:
          - not_null


# daily region uptime mart and testing
  - name: mart_uptime_region_daily
    description: "Reporting mart: daily uptime KPIs aggregated by region and asset type."
    columns:
      - name: date_day
        tests:
          - not_null

      - name: region
        tests:
          - not_null

      - name: asset_type
        tests:
          - not_null

      - name: avg_uptime_pct
        tests:
          - not_null

      - name: downtime_hours
        tests:
          - not_null

      - name: total_hours
        tests:
          - not_null

      - name: n_assets
        tests:
          - not_null


# daily worst-performing assets mart and testing
  - name: mart_worst_assets_daily
    description: "Reporting mart: top 10 worst-performing assets (lowest uptime) per day."
    columns:
      - name: date_day
        tests:
          - not_null
      - name: asset_id
        tests:
          - not_null
      - name: region
        tests:
          - not_null
      - name: asset_type
        tests:
          - not_null
      - name: uptime_pct
        tests:
          - not_null
      - name: downtime_hours
        tests:
          - not_null
      - name: total_hours
        tests:
          - not_null


# incident fact table and testing
  - name: fct_incidents
    description: "Gold incident fact table (one row per incident) used for MTTR and incident rate metrics."
    columns:
      - name: incident_id
        tests:
          - not_null
          - unique

      - name: asset_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_asset')
                field: asset_id

      - name: start_ts
        tests:
          - not_null

      - name: end_ts
        tests:
          - not_null

      - name: duration_hours
        tests:
          - not_null

      - name: severity
        tests:
          - not_null

      - name: cause
        tests:
          - not_null


# daily MTTR and incident rates mart and testing
  - name: mart_mttr_region_daily
    description: "Reporting mart: MTTR and incident rates per day, region, and asset type."
    columns:
      - name: date_day
        tests:
          - not_null
      - name: region
        tests:
          - not_null
      - name: asset_type
        tests:
          - not_null
      - name: mttr_hours
        tests:
          - not_null
      - name: incident_count
        tests:
          - not_null
      - name: fleet_assets
        tests:
          - not_null
      - name: incidents_per_100_assets
        tests:
          - not_null


# user dimension and testing
  - name: dim_user
    description: "Gold user dimension (authoritative user attributes for product and revenue facts)."
    columns:
      - name: user_id
        tests:
          - not_null
          - unique

      - name: created_at
        tests:
          - not_null

      - name: signup_channel
        tests:
          - not_null


# daily product usage fact and testing
  - name: fct_usage_daily
    description: "Gold product usage fact at user-day grain derived from events."
    columns:
      - name: user_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id

      - name: date_day
        tests:
          - not_null

      - name: event_count
        tests:
          - not_null

      - name: is_active
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]


# monthly retention cohorts mart and testing
  - name: mart_retention_cohorts
    description: "Reporting mart: monthly signup cohorts with D7 and D30 retention rates."
    columns:
      - name: cohort_month
        tests:
          - not_null

      - name: cohort_size
        tests:
          - not_null

      - name: retained_d7_rate
        tests:
          - not_null

      - name: retained_d30_rate
        tests:
          - not_null


# daily MRR fact and testing
  - name: fct_mrr_daily
    description: "Daily recurring revenue (MRR) derived from active subscription periods."
    columns:
      - name: date_day
        tests:
          - not_null
          - unique

      - name: mrr_gbp
        tests:
          - not_null

      - name: paying_users
        tests:
          - not_null
